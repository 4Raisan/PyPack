name: Build PyPack downloads
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pypack-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_release.py --windows
      - name: Check packaged interpreter, icon and Tcl/Tk
        shell: pwsh
        run: |
          $env:PYPACK_PYTHON = (Get-Command python).Source
          $process = Start-Process -FilePath (Join-Path $PWD 'dist/PyPack.exe') -ArgumentList '--self-test', 'build/runtime-check.json' -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Packaged runtime check failed' }
          $report = Get-Content build/runtime-check.json -Raw | ConvertFrom-Json
          if (-not $report.ok -or -not $report.frozen -or $report.self_recursion) { throw 'Invalid packaged runtime report' }
          Get-Content build/runtime-check.json
      - name: Attest build provenance for the unsigned downloads
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4
        with:
          subject-path: |
            dist/PyPack.exe
            dist/PyPack.sh
            dist/PyPack.command
            dist/PyPack-*-source.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: pypack-downloads
          path: |
            dist/PyPack.exe
            dist/PyPack.sh
            dist/PyPack.command
            dist/PyPack-*-source.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: pypack-runtime-check
          path: build/runtime-check.json
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: pypack-downloads
          path: dist
      - name: Check Unix launchers and checksums
        shell: bash
        run: |
          (cd dist && sha256sum --check SHA256SUMS.txt)
          for launcher in dist/PyPack.sh dist/PyPack.command; do
            sh -n "$launcher"
            status=0
            sh "$launcher" invalid-command > /tmp/pypack-cli-check.txt 2>&1 || status=$?
            test "$status" -eq 2
            grep -q 'Usage: pypack_setup.py' /tmp/pypack-cli-check.txt
          done
      - name: Create a new draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          version=$(tr -d '\r\n' < VERSION)
          tag="v$version"
          gh api "repos/$GH_REPO/releases?per_page=100" > /tmp/pypack-releases.json
          TAG="$tag" python -c 'import json, os; releases=json.load(open("/tmp/pypack-releases.json")); assert all(r["tag_name"] != os.environ["TAG"] for r in releases), "Release already exists; use a new version"'
          gh release create "$tag" --draft --target "$GITHUB_SHA" --title "PyPack $version" --notes-file "docs/releases/$version.md" dist/*

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-labelledby="title desc">
<title id="title">PyPack architecture</title><desc id="desc">Windows and Unix launchers select Python. The Tkinter interface and command line share package operations. Background workers send results through a queue. Search uses PyPI and installation uses pip in the selected Python environment.</desc>
